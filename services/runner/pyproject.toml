[project]
name = "tandem-runner"
version = "0.1.0"
description = "Tandem imperative shell: reads pipeline.yaml, runs the stage DAG, executes and caches effects, appends events."
requires-python = ">=3.14"
dependencies = ["tandem-core"]

[tool.uv.sources]
tandem-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "tandem_runner"
